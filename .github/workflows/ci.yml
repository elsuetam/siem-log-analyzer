name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar ruff
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install pydantic-settings requests reportlab pypdf pyyaml fastapi httpx sqlalchemy scikit-learn numpy

      - name: Rodar mypy
        run: mypy src

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install pydantic-settings requests reportlab pypdf pyyaml fastapi httpx sqlalchemy scikit-learn numpy

      - name: Rodar testes com cobertura
        run: pytest --cov=siem --cov-report=term-missing --cov-report=xml

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml